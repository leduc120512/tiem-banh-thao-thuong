    />
    <meta name="theme-color" content="#F6F1E7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Thảo Thương Bakery — Bánh sinh nhật viết tay" />
    <meta
      property="og:description"
      content="Ngã ba Cống Trúc, 503 QL1A. Nhận đặt bánh sinh nhật, bánh cưới, lễ nạp tài trọn gói."
    />
    <meta property="og:image" content="/img/cakes/cake-11-1200.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/img/cakes/cake-11-1200.webp" fetchpriority="high" />

    <script>
      // Đặt cờ sớm để CSS biết có JS + có được phép animate hay không.
      // Nhờ vậy trạng thái "ẩn ban đầu" chỉ tồn tại khi chắc chắn GSAP sẽ hiện lại.
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        try {
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('anim')
          if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) d.classList.add('fine')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
